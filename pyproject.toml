[project]
name = "rag-agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David Garcia Romero", email = "DavidIjsud@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.5.0",
    "langchain-google-genai>=4.5.0",
    "langsmith>=0.14.17",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
rag-agentic-ai = "rag_agentic_ai:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
